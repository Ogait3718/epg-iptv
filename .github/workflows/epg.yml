name: Atualizar EPG

on:
  schedule:
    - cron: "0 3 * * *"   # todos os dias às 03:00 UTC
  push:
    branches: [main]       # corre a cada push para o main
  workflow_dispatch:       # permite correr à mão no separador Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O workflow nunca contacta o fornecedor: usa só a cópia pública sanitizada
      # (nomes, tvg-id e grupos), atualizada a partir do Mac pelo atualizar_lista.sh
      - name: Verificar canais_publicos.m3u (sem URLs nem credenciais)
        run: |
          test -s canais_publicos.m3u || { echo "::error::Falta o canais_publicos.m3u."; exit 1; }
          if grep -qiE 'https?:|://|username|password|get\.php|player_api' canais_publicos.m3u; then
            echo "::error::canais_publicos.m3u tem URLs ou credenciais."; exit 1
          fi

      - name: Gerar epg.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_epg.py --m3u canais_publicos.m3u --report ""

      - name: Preparar site (só o epg.xml)
        run: |
          mkdir -p _site
          cp epg.xml _site/epg.xml
          gzip -9 -c epg.xml > _site/epg.xml.gz
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}epg.xml
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
